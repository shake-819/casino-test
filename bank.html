<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>2−1 情報処理銀行</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --cover:#12264a;--cover2:#0b1a36;--paper:#f6f8fa;--paper2:#e8eef3;--rule:#b7c9d8;
  --ink:#14213a;--mut:#5a6b85;--gold:#d4af37;--gold2:#f6e27a;--shu:#c8322f;
  --up:#c62839;--dn:#1f6fd1;--ok:#1b7f4b;--bad:#b3261e;
  --mj:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --gt:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100dvh;background:linear-gradient(180deg,var(--cover) 0,var(--cover2) 100%) fixed;color:var(--paper);font-family:var(--gt);line-height:1.55;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
#app{max-width:720px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit}
.cover{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-family:var(--mj);font-weight:800;font-size:clamp(22px,6vw,30px);line-height:1.15;background:linear-gradient(#f6e27a,#d4af37 60%,#8a6a12);-webkit-background-clip:text;background-clip:text;color:transparent}
.hr{display:flex;align-items:center;gap:8px}.fsel{font:inherit;font-size:12px;padding:6px 8px;border-radius:8px;border:1px solid var(--gold2);background:rgba(0,0,0,.25);color:inherit;max-width:44vw}.fsel[hidden]{display:none}.fsel option{color:#222}
.brand small{display:block;letter-spacing:.42em;color:var(--gold2);font-size:11px;margin-top:2px}
.net{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.net .lab{display:block;color:#a9b8d0;font-size:13px}
#net{font-family:var(--mj);font-weight:800;font-size:clamp(34px,10vw,52px);line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.net-r{text-align:right;font-size:12px;color:#a9b8d0;display:flex;flex-direction:column;gap:2px}
.net-r b{color:var(--gold2);font-family:var(--mj);letter-spacing:.08em}
.sumrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.sumrow div{background:#ffffff12;border:1px solid #ffffff22;border-radius:10px;padding:7px 6px;text-align:center;min-width:0}
.sumrow span{display:block;font-size:11px;color:#a9b8d0}
.sumrow b{display:block;font-family:var(--mj);font-size:14px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--paper);color:var(--ink);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 8px 22px #0006;border-top:4px solid var(--gold)}
.card h2,.sec{font-family:var(--mj);font-size:19px;font-weight:800;margin-bottom:8px;color:var(--ink)}
.sec{color:var(--paper);margin:20px 0 10px}
.card h2 small{font-family:var(--gt);font-weight:400;color:var(--mut);font-size:13px;margin-left:4px}
.mut{color:var(--mut);font-size:13px}
.lab{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.amt{font-family:var(--mj);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px;padding:10px 12px;background:var(--paper2);border-radius:10px}
.two .lab{margin-top:0}
input,select{width:100%;min-height:46px;padding:8px 12px;border-radius:9px;border:1.5px solid var(--rule);background:#fff;color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #2a7fff;outline-offset:2px}
input[type=range]{padding:0;min-height:34px;accent-color:var(--cover);border:0;background:none}
.qs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.q{min-height:38px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--rule);background:#fff;color:var(--ink);cursor:pointer}
.q:active{background:var(--paper2)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn{min-height:46px;padding:8px 18px;border-radius:10px;border:2px solid var(--cover);background:var(--cover);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--cover)}
.btn.sell{background:var(--dn);border-color:var(--dn)}
.btn.buy{background:var(--up);border-color:var(--up)}
.btn.s{min-height:38px;padding:4px 14px;font-size:14px}
.btn.gold{background:linear-gradient(#f6e27a,#c99a1c);border-color:var(--gold2);color:#2a1c00}
.btn.one{grid-column:1/-1}
/* 通帳 */
.book{border:1.5px solid var(--rule);border-radius:8px;overflow:hidden;font-size:12.5px;background:repeating-linear-gradient(#fff 0 32px,#f0f5f9 32px 64px)}
.bk-h,.bk-r{display:grid;grid-template-columns:3.6em 1fr 4.6em 4.6em 5.4em;gap:6px;padding:6px 8px;align-items:center;border-bottom:1px solid var(--rule)}
.bk-h{background:var(--cover);color:#fff;font-size:11.5px;font-weight:700}
.bk-h span:nth-child(n+3),.bk-r span:nth-child(n+3){text-align:right;font-variant-numeric:tabular-nums}
.bk-r .m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-r span:nth-child(1){color:var(--mut)}
.bk-e{padding:18px 10px;color:var(--mut);text-align:center}
.notice{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:13.5px}
.notice time{color:var(--mut);flex:none;font-variant-numeric:tabular-nums}
.notice.ok{color:var(--ok)}.notice.err{color:var(--bad)}
/* 投資 */
.syms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sym{background:var(--paper);color:var(--ink);border:2px solid transparent;border-radius:12px;padding:9px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.sym.on{border-color:var(--gold);box-shadow:0 0 0 2px #d4af3766}
.sym .tk{font-family:var(--mj);font-size:12px;color:var(--mut);font-weight:800;letter-spacing:.1em}
.sym b{font-size:12.5px;line-height:1.3;min-height:2.6em}
.sym .pr{font-family:var(--mj);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.chg{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
.spark{display:block;height:28px;margin-top:2px}
.spark svg{width:100%;height:100%;display:block}
.ch-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ch-h .amt{font-size:28px;text-align:right;line-height:1.1}
.ch-h .chg{display:block;text-align:right}
#chart svg{width:100%;height:auto;display:block;margin:8px 0;border-radius:8px;background:#fff;border:1px solid var(--rule)}
#hinfo{font-size:13.5px;padding:8px 10px;background:var(--paper2);border-radius:8px;margin-bottom:6px}
.qrow{display:grid;grid-template-columns:1fr;gap:6px}
#qc{min-height:20px;font-size:13px;color:var(--mut)}
/* 定期 */
.ladder{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.ladder .q{display:flex;flex-direction:column;align-items:center;line-height:1.25;padding:5px 11px}
.ladder .q small{color:var(--up);font-weight:700}
.dur{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.amtp{margin-top:6px;word-break:break-all}.amtp b{color:var(--ink)}
#fp{margin:10px 0 0;padding:10px 12px;background:var(--paper2);border-radius:8px;font-size:14px}
.item{padding:12px 0;border-bottom:1px dashed var(--rule)}
.item:last-child{border-bottom:0}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ttl{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:99px;background:var(--gold);color:#241a00;font-size:12px;font-weight:800;letter-spacing:.05em;vertical-align:middle}
.bdg{position:absolute;top:3px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--shu);color:#fff;font-size:10px;font-style:normal;line-height:16px;font-weight:700;display:none}
.mw{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto;padding:4px 2px;margin:8px 0}
.mb{max-width:88%;padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;background:var(--paper2)}
.mb.a{align-self:flex-start;background:#fff6d6;border:1px solid #e6c55a;color:#4a3a05}
.mb.u{align-self:flex-end}
.mb.n{outline:2px solid var(--shu)}
.mb b{display:block;margin-bottom:2px}
.mb small{display:block;color:var(--mut);font-size:11px;margin-top:3px;white-space:normal}
#mt{width:100%;min-height:84px;padding:10px;font-size:16px;border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink);font-family:inherit;resize:vertical}
.prog{height:9px;background:var(--paper2);border-radius:99px;overflow:hidden;margin:8px 0 4px;border:1px solid var(--rule)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2b6cb0,#4aa3ff)}
.lock{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--cover);color:var(--gold2);font-weight:700}
/* レベル */
.lvbig{display:flex;align-items:baseline;gap:10px}
.lvbig b{font-family:var(--mj);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.rk{display:grid;grid-template-columns:34px 1fr auto 56px;gap:8px;align-items:center;padding:9px 6px;border-bottom:1px dashed var(--rule);font-size:15px}
.rk:last-child{border-bottom:0}
.rk.h{font-size:12px;color:var(--mut);padding-top:2px}
.rk.me{background:#fff4c8;border-radius:8px}
.rk .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .r{font-family:var(--mj);font-weight:800;text-align:center}
.rk .l,.rk .p{text-align:right;font-variant-numeric:tabular-nums}
/* 融資 */
.cs{display:flex;align-items:center;gap:14px}
.cs b{font-family:var(--mj);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.bar{flex:1;height:12px;background:var(--paper2);border-radius:99px;overflow:hidden;border:1px solid var(--rule)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c8322f,#d4af37,#1b7f4b)}
.co{background:var(--paper);color:var(--ink);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 8px 22px #0006;border-left:6px solid var(--tc)}
.co-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.co-h b{font-family:var(--mj);font-size:18px}
.seal{display:inline-block;padding:2px 9px;border:2px solid var(--tc);color:var(--tc);border-radius:6px;font-family:var(--mj);font-weight:800;font-size:13px;transform:rotate(-4deg);letter-spacing:.06em;background:#fff}
.t1{--tc:#1b6f8a}.t2{--tc:#2c7a4b}.t3{--tc:#a07a12}.t4{--tc:#b3541e}.t5{--tc:#1a1a1a}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;margin:10px 0;font-size:13.5px}
.facts span{color:var(--mut)}
.facts b{font-variant-numeric:tabular-nums}
.stars{color:var(--shu);letter-spacing:.05em}
.lp{margin:6px 0 10px;font-size:14px;padding:8px 10px;background:var(--paper2);border-radius:8px}
.row-l{padding:12px 0;border-bottom:1px dashed var(--rule);display:grid;gap:4px}
.row-l:last-child{border-bottom:0}
.due.bad{color:var(--bad);font-weight:700}
/* 振込 */
.tx-i{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--rule);flex-wrap:wrap}
.st{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--rule);background:#fff}
.st.pend{color:#8a6a12;border-color:#d4af37}.st.sent{color:var(--ok);border-color:var(--ok)}.st.cancel{color:var(--mut)}
.demo{padding:9px 12px;background:#fff6d6;border:1px solid #e6c55a;border-radius:8px;font-size:13px;margin-bottom:10px;color:#4a3a05}
.acno{font-family:var(--mj);font-size:26px;font-weight:800;letter-spacing:.14em}
/* nav */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--cover2);border-top:1px solid #ffffff22;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#tabs div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
#tabs button{background:none;border:0;color:#a9b8d0;padding:9px 2px 8px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;position:relative}
#tabs button span{font-size:19px;line-height:1.2}
#tabs button.on{color:var(--gold2);font-weight:700}
#tabs button.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--shu);border-radius:0 0 3px 3px}
#toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(92vw,520px);background:#0b1a36;color:#fff;border:1px solid var(--gold);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:#ff8a80;background:#4a1212}
#toast.ok{border-color:#7be0a8}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:400px){.bk-h,.bk-r{grid-template-columns:3.2em 1fr 3.9em 3.9em 4.6em;font-size:11.5px;gap:4px}.sym b{font-size:11.5px}}
/* ===== 3D GAME UI LAYER (stage 1) ===== */
:root{--ease3:cubic-bezier(.2,.9,.25,1.2)}
body{background:radial-gradient(ellipse 90% 50% at 50% -10%,#2a4f8c88,transparent 70%),radial-gradient(ellipse at 50% 110%,#d4af3722,transparent 55%),linear-gradient(180deg,var(--cover) 0,var(--cover2) 100%) fixed}
#app{perspective:1400px}
/* logo & net worth: extruded gold */
.logo{filter:drop-shadow(0 1px 0 #8a6a12) drop-shadow(0 2px 0 #6b4f0c) drop-shadow(0 3px 0 #4a3608) drop-shadow(0 8px 10px #000a) drop-shadow(0 0 14px #d4af3766)}
#net{text-shadow:0 1px 0 #8aa0c0,0 2px 0 #52688c,0 3px 0 #2c3f66,0 4px 0 #1a2a4a,0 12px 18px #000a}
/* summary tiles: glass plates standing on the cover */
.sumrow div{background:linear-gradient(160deg,#ffffff26,#ffffff08);border-color:#ffffff30;box-shadow:inset 0 1px 0 #ffffff40,0 1px 0 #0a1630,0 2px 0 #0a1630,0 3px 0 #081226,0 10px 14px #0007;transform:rotateX(8deg);transform-origin:50% 100%;transition:transform .2s var(--ease3)}
.sumrow div:hover{transform:rotateX(0) translateY(-4px)}
/* paper cards: stacked sheets with depth */
.card,.co{position:relative;box-shadow:0 1px 0 #d3dde7,0 2px 0 #c2cfdc,0 3px 0 #b3c2d2,0 4px 0 #a2b3c6,0 16px 26px #0009,inset 0 1px 0 #fff;background:linear-gradient(180deg,#fff,var(--paper) 14%,var(--paper2))}
.card{border-top:4px solid var(--gold)}
.card::after{content:'';position:absolute;left:0;right:0;top:0;height:60px;border-radius:14px 14px 0 0;background:linear-gradient(#ffffffaa,transparent);pointer-events:none}
.card>*,.co>*{position:relative;z-index:1}
.co{transition:transform .22s var(--ease3),box-shadow .22s}
.co:hover{transform:translateY(-4px) rotateX(2deg);box-shadow:0 1px 0 #d3dde7,0 2px 0 #c2cfdc,0 3px 0 #b3c2d2,0 4px 0 #a2b3c6,0 26px 34px #000a,inset 0 1px 0 #fff}
/* buttons: chunky keycaps */
.btn{position:relative;overflow:hidden;box-shadow:0 1px 0 #0a1630,0 2px 0 #0a1630,0 3px 0 #081226,0 4px 0 #060e1e,0 9px 12px #0008,inset 0 2px 0 #ffffff40,inset 0 -3px 5px #0004;transition:transform .12s var(--ease3),box-shadow .12s,filter .15s}
.btn::before{content:'';position:absolute;left:6%;right:6%;top:2px;height:46%;border-radius:999px 999px 40% 40%;background:linear-gradient(#ffffff70,#fff0);pointer-events:none}
.btn:not(:disabled):hover{transform:translateY(-3px) perspective(500px) rotateX(10deg);filter:brightness(1.1)}
.btn:not(:disabled):active{transform:translateY(4px);box-shadow:0 0 0 #060e1e,0 2px 4px #0008,inset 0 3px 8px #0006;filter:brightness(.95)}
.btn.alt{box-shadow:0 1px 0 #b7c9d8,0 2px 0 #9fb3c6,0 3px 0 #8aa0b6,0 4px 0 #758ba3,0 9px 12px #0006,inset 0 -3px 5px #0001}.btn.alt::before{background:linear-gradient(#fff,#fff0)}
.btn.buy{box-shadow:0 1px 0 #7a1a1a,0 2px 0 #6a1414,0 3px 0 #561010,0 4px 0 #440c0c,0 9px 12px #0008,inset 0 2px 0 #ffffff40,inset 0 -3px 5px #0004}
.btn.sell{box-shadow:0 1px 0 #123e7a,0 2px 0 #0f3568,0 3px 0 #0c2c58,0 4px 0 #092348,0 9px 12px #0008,inset 0 2px 0 #ffffff40,inset 0 -3px 5px #0004}
.btn.gold{box-shadow:0 1px 0 #8a6a12,0 2px 0 #7a5c0e,0 3px 0 #6b4f0c,0 4px 0 #4a3608,0 9px 12px #0008,0 0 18px #d4af3766,inset 0 2px 0 #fff9,inset 0 -3px 5px #0003}
.q{box-shadow:0 2px 0 #9fb3c6,0 5px 6px #0003;transition:transform .12s var(--ease3),box-shadow .12s}
.q:not(:disabled):hover{transform:translateY(-2px)}.q:active{transform:translateY(2px);box-shadow:0 0 0 #9fb3c6,inset 0 2px 4px #0003}
/* stock tiles: pop-up plates */
.sym{box-shadow:0 1px 0 #d3dde7,0 2px 0 #b3c2d2,0 3px 0 #98aac0,0 4px 0 #8497ae,0 12px 16px #0008;transition:transform .2s var(--ease3),box-shadow .2s;transform-origin:50% 100%}
.sym:hover{transform:translateY(-5px) rotateX(6deg)}
.sym.on{transform:translateY(-8px) rotateX(-4deg);box-shadow:0 0 0 2px #d4af3788,0 1px 0 #d3dde7,0 2px 0 #b3c2d2,0 3px 0 #98aac0,0 4px 0 #8497ae,0 22px 26px #000a,0 0 22px #d4af3788}
/* inputs: recessed */
input,select{box-shadow:inset 0 3px 6px #14213a22,0 1px 0 #fff}
input[type=range]{box-shadow:none}
.two,#fp,#hinfo,.lp{box-shadow:inset 0 2px 6px #14213a1c,0 1px 0 #fff}
.prog,.bar{box-shadow:inset 0 2px 4px #0003}
.prog i,.bar i{box-shadow:inset 0 2px 0 #fff6,inset 0 -2px 3px #0003}
.book{box-shadow:inset 0 0 0 1px #fff,0 6px 10px #0002}
.rk.me{box-shadow:0 3px 8px #d4af3755}
.ttl,.lock,.seal{box-shadow:0 2px 0 #0004,inset 0 1px 0 #fff6}
/* bottom nav: raised console */
#tabs{background:linear-gradient(#17315c,var(--cover2));border-top:1px solid #ffffff44;box-shadow:0 -1px 0 #000,0 -12px 26px #000a,inset 0 1px 0 #ffffff22}
#tabs button{transition:transform .18s var(--ease3),color .2s}
#tabs button span{display:inline-block;filter:drop-shadow(0 2px 0 #0008) drop-shadow(0 4px 3px #0007);transition:transform .22s var(--ease3)}
#tabs button:hover span{transform:translateY(-3px) scale(1.12)}
#tabs button.on span{transform:translateY(-5px) scale(1.25) perspective(200px) rotateY(-12deg);filter:drop-shadow(0 2px 0 #5c430a) drop-shadow(0 7px 5px #000a) drop-shadow(0 0 10px #d4af37)}
#tabs button.on::before{box-shadow:0 0 12px var(--shu),0 3px 0 #7a1a18}
#toast{box-shadow:0 1px 0 #6b4f0c,0 2px 0 #4a3608,0 14px 24px #000b}
/* tab-switch entrance: only while #view has .enter (so live re-renders never flicker) */
#view.enter>*{animation:b3in .55s var(--ease3) backwards;transform-origin:50% 0}
#view.enter>*:nth-child(2){animation-delay:.07s}#view.enter>*:nth-child(3){animation-delay:.14s}#view.enter>*:nth-child(n+4){animation-delay:.2s}
@keyframes b3in{from{opacity:0;transform:perspective(900px) translateY(34px) rotateX(-18deg) scale(.96)}}
@media(hover:none){.co:hover,.sym:hover,.sumrow div:hover{transform:none}}
/* ===== 3D BUILDING (stage 2) ===== */
#gate{position:fixed;inset:0;z-index:1000;background:#050810}#gl3d{width:100%;height:100%;display:block}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle,#fffdf0 0,#ffe9a0 70%,#ffd76a)}
/* ===== 3D HALL (stage 3) ===== */

<script>
'use strict';
/* ============ 設定 ============ */
// ★ Supabase の「Project URL」と「anon public key」を入れてください（Settings → API）
const SUPABASE={url:'https://rzqhvomycxqqzudhpzen.supabase.co',key:'sb_publishable_8p4zhhVZ1qavPtPSi595WQ_1ZtblEBi'};
const KEY='cj_bank_v1', WK='cj_wallet', AK='cj_bank_auth', UK='cj_bank_ui';   // KEY：カジノが資産判定に読む写し／WK：カジノと共通の手持ちチップ

/* ============ ユーティリティ ============ */
const $=s=>document.querySelector(s);
/* 金額まわり：大きくなる金額（預金・株数・定期など）は BigInt で扱い、サーバーとは文字列でやり取りする */
const BI=v=>{try{if(typeof v=='bigint')return v;if(typeof v=='number')return BigInt(Math.round(v));return BigInt(String(v).split('.')[0]||'0')}catch(e){return 0n}};
/* 数字の表示形式：コンマ／日本語の単位／英語の単位（銀行レベル1000万以上の人だけ選べる）。単位表記は大きいほうから2つの単位だけ見せ、それより小さい桁は隠す */
const JPU=['','万','億','兆','京','垓','秭','穣','溝','澗','正','載','極','恒河沙','阿僧祇','那由他','不可思議','無量大数'],
      ENU=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qad','Qid','Sxd','Spd','Ocd','Nod','Vg'];
function fmtUnit(b,size,units){   // b：0以上のBigInt。単位が足りない巨大な数は null（コンマ表記にもどす）
  const s=b.toString(),g=[];
  for(let e=s.length;e>0;e-=size)g.push(s.slice(Math.max(0,e-size),e));   // g[0]が一番小さい桁
  if(g.length>units.length)return null;
  const top=g.length-1;let out='';
  for(let i=top;i>=Math.max(0,top-1);i--){const v=g[i].replace(/^0+/,'');if(v)out+=v+units[i]}
  return out||'0'}
const FMT_LV=1e7;   // 表示形式を選べる銀行レベル（1000万）
function fmtOk(){try{const l=lvN();if(l>=FMT_LV)return true;if(LV&&LV.level!=null)return false;return Number(localStorage.getItem('cj_bank_lv'))>=FMT_LV}catch(e){return false}}
const fmt=n=>{try{const b=BI(n),m=fmtOk()?(ui.fmt||'c'):'c';
  if(m!='c'){const neg=b<0n,a=neg?-b:b,r=m=='j'?fmtUnit(a,4,JPU):fmtUnit(a,3,ENU);if(r!=null)return(neg?'-':'')+r}
  return b.toLocaleString('ja-JP')}catch(e){return String(n)}};
const mulP=(q,p)=>BI(q)*BigInt(Math.round(p*100))/100n;   // 株数×株価（株価は小数2桁）
const J=v=>JSON.stringify(v,(k,x)=>typeof x=='bigint'?x.toString():x);
const CAP=1e15;   // 手持ち（カジノの財布）の上限：1000兆
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
/* ---- 銀行レベル1000兆以上の人は、入出金・振込の金額を「1〜9999 × 単位」で入れられる（SVIPの賭け金と同じ方式） ---- */
const BIGLV=1e15;
function bigOk(){try{const l=lvN();if(l>=BIGLV)return true;if(LV&&LV.level!=null)return false;return Number(localStorage.getItem('cj_bank_lv'))>=BIGLV}catch(e){return false}}
const amtMax={ma:3,ta:17};   // 使える単位の上限（JPUの添字）。入出金は手持ちの上限が1000兆なので兆まで、振込は無量大数まで
function amtField(id,ph){
  if(!bigOk())return `<input id="${id}" type="number" inputmode="numeric" min="1" step="1" placeholder="${ph}">`;
  const mx=amtMax[id]||17;
  return `<div class="dur"><input id="${id}n" type="number" inputmode="numeric" min="1" max="9999" step="1" value="1" oninput="amtN('${id}')" aria-label="金額（1〜9999）"><select id="${id}u" onchange="amtN('${id}')" aria-label="単位">${JPU.slice(0,mx+1).map((u,i)=>`<option value="${i*4}">${u||'（単位なし）'}</option>`).join('')}</select></div><input id="${id}" type="hidden" value="1"><div class="mut amtp" id="${id}p"></div>`}
function amtPrev(id){const p=$('#'+id+'p');if(!p)return;const v=num('#'+id);
  p.innerHTML=v>0n?`＝ <b>${v.toLocaleString('ja-JP')}</b>${fmtUnit(v,4,JPU)&&fmtUnit(v,4,JPU)!=v.toLocaleString('ja-JP')?`（${fmtUnit(v,4,JPU)}）`:''}`:'金額は 1〜9999 と単位で入力します'}
const amtEx={};   // 「手持ち全部」などで入れた、1〜9999＋単位では表せない半端な額
function amtN(id){const ne=$('#'+id+'n'),ue=$('#'+id+'u');if(!ne||!ue)return;delete amtEx[id];
  let n=Math.floor(+ne.value);if(!(n>=1))n=0;if(n>9999){n=9999;ne.value=9999}
  $('#'+id).value=n>0?(BigInt(n)*10n**BigInt(+ue.value)).toString():'';amtPrev(id)}
function amtSync(id){const ne=$('#'+id+'n'),ue=$('#'+id+'u');if(!ne||!ue){return}   // 「手持ち全部」「預金全部」などで入れた値を、1〜9999＋単位の形に直す
  const v=num('#'+id),mx=amtMax[id]||17;let best=null;
  if(v>0n)for(let i=mx;i>=0;i--){const d=10n**BigInt(i*4);if(v%d==0n&&v/d<=9999n){best=[v/d,i];break}}
  delete amtEx[id];if(best){ne.value=best[0].toString();ue.value=String(best[1]*4)}else if(v>0n){amtEx[id]=v;ne.value=''}
  amtPrev(id)}
function amtRest(id){if(!$('#'+id+'n'))return;if(amtEx[id]){$('#'+id).value=amtEx[id].toString();amtPrev(id)}else amtN(id)}   // 画面を描き直したあとの復元   // 割り切れない半端な額は、そのままの数値（隠し欄）で送る
const num=s=>{const t=String(($(s)||{}).value||'').trim().replace(/,/g,'');if(/^\d+$/.test(t))return BigInt(t);const n=Math.floor(+t);return Number.isFinite(n)&&n>0?BigInt(n):0n};   // 金額・株数（BigInt）
const numN=s=>Math.max(0,Math.floor(+$(s).value)||0);   // 小さい数（信用取引の株数）
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const fmtDate=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const fmtD=t=>{const d=new Date(t),n=new Date();return d.toDateString()==n.toDateString()?`${p2(d.getHours())}:${p2(d.getMinutes())}`:`${d.getMonth()+1}/${d.getDate()}`};
function fmtDur(ms){const s=Math.max(0,Math.ceil(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;
  if(d)return `${d}日${h}時間`;if(h)return `${h}時間${p2(m)}分`;if(m)return `${m}分${p2(x)}秒`;return `${x}秒`}
function fmtMin(m){if(m>=1440&&m%1440==0)return `${m/1440}日`;if(m>=60&&m%60==0)return `${m/60}時間`;if(m>=60)return `${Math.floor(m/60)}時間${m%60}分`;return `${m}分`}

/* ============ Supabase（RPC） ============ */
async function rpc(fn,args){
  if(!SUPABASE.url||!SUPABASE.key)throw new Error('Supabaseの設定がまだです（bank.html の SUPABASE に URL と key を入れてください）');
  let r;
  try{r=await fetch(SUPABASE.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{'Content-Type':'application/json',apikey:SUPABASE.key,Authorization:'Bearer '+SUPABASE.key},body:J(args||{})})}
  catch(e){throw new Error('通信に失敗しました。ネットワークを確認してください')}
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error((j&&j.message)||'エラーが発生しました（'+r.status+'）');
  return j;
}

/* ============ 手持ちチップ（カジノと共通） ============ */
let memW=null;
function wRaw(){try{const v=JSON.parse(localStorage.getItem(WK));if(v&&Number.isFinite(v.chips))return v}catch(e){}return null}
function wallet(){const v=wRaw();if(v)return Math.min(CAP,Math.floor(v.chips));if(memW==null){memW=1000;setWallet(1000)}return memW}
function setWallet(n){memW=Math.min(CAP,Math.floor(n));try{localStorage.setItem(WK,JSON.stringify({chips:memW,t:Date.now(),src:'bank'}))}catch(e){}}

/* ============ 状態 ============ */
let A=(()=>{try{const v=JSON.parse(localStorage.getItem(AK));if(v&&v.acct&&v.secret)return v}catch(e){}return null})();   // {acct, secret}
let ui=(()=>{try{return Object.assign({tab:'acct',sel:'',fmt:'c'},JSON.parse(localStorage.getItem(UK))||{})}catch(e){return{tab:'acct',sel:''}}})();
let S=null;            // サーバーから受け取った口座の状態
let SYMS=[],LOANS=[];  // 銘柄・融資会社（サーバー定義）
let MK={};             // 株価 {sym:{p,h:[...]}}
let skew=0,seq=0,busy=false,mkBusy=false,lastFetch=0,lastSig='',seenNotice=0,seenNews=0,loginErr='';
const now=()=>Date.now()+skew;
const CO=id=>LOANS.find(c=>c.id==id)||{name:id};
const H=id=>(S&&S.hold[id])||{q:0n,c:0n};
const P=id=>MK[id]?MK[id].p:(S&&S.px[id])||0;
const saveUi=()=>{try{localStorage.setItem(UK,JSON.stringify(ui))}catch(e){}};
const saveAuth=()=>{try{A?localStorage.setItem(AK,JSON.stringify(A)):localStorage.removeItem(AK)}catch(e){}};

let tt;
function toast(m,k){const e=$('#toast');e.textContent=m;e.className='on '+(k||'');clearTimeout(tt);tt=setTimeout(()=>e.className='',3400)}

/* 集計 */
const MGC=()=>(S&&S.mgc)||{rate:.005,liq:.8,levs:[2,3,5]};
const mgInt=(p,t)=>p.e*p.q*MGC().rate*Math.max(0,(t-p.t)/3600000);                                    // 金利の累計
const mgEq=(p,t)=>p.m+(p.side=='long'?P(p.sym)-p.e:p.e-P(p.sym))*p.q-mgInt(p,t);                      // 評価額（サーバーと同じ式）
const mgV=t=>S&&S.margin?S.margin.reduce((a,p)=>a+Math.max(0,mgEq(p,t)),0):0;
const invV=()=>S?SYMS.reduce((a,d)=>a+mulP(H(d.id).q,P(d.id)),0n)+BI(mgV(now())):0n;
const fixV=()=>S?S.fixed.reduce((a,f)=>a+f.amt,0n):0n;
const owed=(l,t)=>l.amt+l.int+(t>l.due?Math.round(l.amt*.01*Math.floor((t-l.due)/60000)):0);
const loanV=t=>S?S.loans.reduce((a,l)=>a+owed(l,t),0):0;

/* カジノ側の「資産あり？」判定用に、サーバーの状態の写しを置く */
function mirror(){try{const hold={},s={};SYMS.forEach(d=>{hold[d.id]={q:H(d.id).q};s[d.id]={p:P(d.id)}});
  localStorage.setItem(KEY,J({v:2,srv:1,dep:S.dep,fixed:S.fixed.map(f=>({amt:f.amt})),hold,mg:Math.floor(mgV(now())),mk:{s}}))}catch(e){}}

/* ============ サーバーとの同期（軽量版） ============ */
// 定期的に取るのは「軽い状態」だけ。固定データは最初の1回、履歴は通帳/振込タブで必要なときだけ取る。
let STATIC=null,HIST={led:[],tx:[],notices:[]},histV='',histStale=true,hBusy=false;
const needH=()=>ui.tab=='acct'||ui.tab=='tx';   // 履歴（通帳・振込履歴・お知らせ）を使う画面
async function fetchHist(){
  if(!A||hBusy)return false;hBusy=true;
  try{
    const h=await rpc('bank_history',{p_acct:A.acct,p_secret:A.secret});
    (h.led||[]).forEach(e=>{e.o=BI(e.o);e.i=BI(e.i);e.b=BI(e.b)});(h.tx||[]).forEach(x=>{x.a=BI(x.a)});HIST={led:h.led,tx:h.tx,notices:h.notices};histV=JSON.stringify(h.hv);histStale=false;
    if(S){S.led=HIST.led;S.tx=HIST.tx;S.notices=HIST.notices}
    return true;
  }catch(e){return false}finally{hBusy=false}
}
function syncHist(){if(S&&needH()&&histStale&&!hBusy)fetchHist().then(ok=>{if(ok&&S&&needH())render()})}
async function refresh(withMk){
  if(!A)return;
  if(!S){HIST={led:[],tx:[],notices:[]};histV='';histStale=true}   // 口座を切り替えた直後
  const my=++seq;lastFetch=Date.now();
  const useMk=!!withMk&&!!S&&!mkBusy;if(useMk)mkBusy=true;       // 投資タブでは株価の差分も同じ通信で受け取る
  try{
    const args={p_acct:A.acct,p_secret:A.secret,p_nsince:S?seenNotice:null};
    if(useMk){args.p_mk=true;if(mkSince!=null)args.p_since=mkSince}
    const [st,s]=await Promise.all([STATIC?null:rpc('bank_static'),rpc('bank_state_lite',args)]);
    if(st)STATIC=st;
    if(my<seq)return;
    if(needH()&&(!S||JSON.stringify(s.hv)!=histV))await fetchHist();   // 画面に必要で、履歴が変わっていたときだけ
    if(my<seq)return;
    applyState(s);
    if(s.mk){applyMk(s.mk);if(S)updateLive()}
  }catch(e){
    if(/口座が見つかりません/.test(e.message)){A=null;S=null;saveAuth();loginErr=e.message;render();return}
    toast(e.message,'err');
  }finally{if(useMk)mkBusy=false}
}
function normS(s){s.dep=BI(s.dep);for(const k in(s.hold||{})){const h=s.hold[k];h.q=BI(h.q);h.c=BI(h.c)}(s.fixed||[]).forEach(f=>{f.amt=BI(f.amt);f.int=BI(f.int)})}
function applyState(s){
  const first=!S;normS(s);
  {const sg=J([s.dep,s.hv,s.fixed&&s.fixed.length,s.hold,s.margin&&s.margin.length]);quietN=sg===lastSg?Math.min(3,quietN+1):0;lastSg=sg}
  skew=s.now-Date.now();
  s.syms=STATIC.syms;s.cos=STATIC.cos;s.mgc=STATIC.mgc;                 // 固定データ
  s.led=HIST.led;s.tx=HIST.tx;s.notices=HIST.notices;                    // 履歴（取得済みのもの）
  S=s;SYMS=s.syms;LOANS=s.cos;
  for(const k in s.px){MK[k]=MK[k]||{p:+s.px[k],h:[+s.px[k]]};MK[k].p=+s.px[k]}
  if(!SYMS.some(d=>d.id==ui.sel)){ui.sel=SYMS[0].id;saveUi()}
  const maxId=s.hv[2]||0;
  if(first){seenNotice=maxId;seenNews=s.news?s.news.at:0;pollMk()}
  else{
    (s.fresh||[]).filter(n=>n.id>seenNotice).reverse().forEach(n=>toast(n.m,n.k));
    seenNotice=Math.max(seenNotice,maxId);
    if(s.news&&s.news.at>seenNews){if(now()-s.news.at<60000)toast(s.news.msg,s.news.msg.startsWith('📈')?'ok':'err');seenNews=s.news.at}
  }
  if(JSON.stringify(s.hv)!=histV)histStale=true;
  mirror();
  const sig=J([s.dep,s.credit,s.name,s.hold,s.margin,s.fixed,s.apps,s.loans]);
  if(first||sig!=lastSig){lastSig=sig;render()}else updateLive();
  syncHist();
}
let mkSince=null;   // 受け取り済みの最新の履歴ID（nullなら全履歴を取る）
function applyMk(m){
  let mx=mkSince;
  for(const k in m){
    const d=m[k],nh=(d.h||[]).map(Number),cur=MK[k];
    if(d.last!=null)mx=Math.max(mx==null?0:mx,+d.last);
    if(d.full!==false||!cur)MK[k]={p:+d.p,h:nh};                       // 全履歴（初回・長時間離脱後・旧サーバー）
    else{cur.p=+d.p;if(nh.length)cur.h=cur.h.concat(nh).slice(-300)}   // 差分を末尾に足す（最大300点）
  }
  mkSince=mx;
}
async function pollMk(){
  if(mkBusy||!S)return;mkBusy=true;
  try{
    // 初回は引数なし（全履歴）、以降は「この ID より新しい行だけ」を要求する
    applyMk(await rpc('bank_market_get',mkSince==null?{}:{p_since:mkSince}));
    if(S)updateLive();
  }catch(e){}finally{mkBusy=false}
}
/* 操作を実行 → 状態を取り直す */
async function act(fn,args,okMsg){
  if(busy)return{ok:false};busy=true;
  try{
    const r=await rpc(fn,Object.assign({p_acct:A.acct,p_secret:A.secret},args||{}));
    await refresh();
    if(okMsg)toast(typeof okMsg=='function'?okMsg(r):okMsg,'ok');
    return{ok:true,r};
  }catch(e){toast(e.message,'err');return{ok:false}}
  finally{busy=false}
}

/* ============ 口座のひらき方 ============ */
async function doCreate(){
  if(busy)return;busy=true;
  try{const r=await rpc('bank_create',{p_name:$('#cn').value.trim().slice(0,12)});
    A={acct:r.acct,secret:r.secret};saveAuth();loginErr='';S=null;await refresh();
    toast('口座を開設しました。「振込」タブの引き継ぎコードを必ず控えてください','ok');
  }catch(e){toast(e.message,'err')}finally{busy=false}
}
async function doImport(){
  const m=$('#cc').value.trim().match(/^(\d{6})-([0-9A-Za-z]{64})$/);
  if(!m)return toast('引き継ぎコードの形式が正しくありません','err');
  A={acct:m[1],secret:m[2]};saveAuth();loginErr='';S=null;await refresh();
  if(S)toast('口座に入りました','ok');
}
function copyCode(){
  const c=A.acct+'-'+A.secret;
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(c).then(()=>toast('引き継ぎコードをコピーしました','ok'),()=>prompt('コピーしてください',c));
  else prompt('コピーしてください',c);
}
function logout(){
  if(!confirm('この端末から口座を外します。引き継ぎコードを控えていないと、二度と入れなくなります。よろしいですか？'))return;

/* ============ 口座 ============ */

async function doIn(){const a=num('#ma');if(a<1)return toast('金額を入力してください','err');if(a>wallet())return toast('手持ちチップが足りません','err');
  setWallet(wallet()-Number(a));const r=await act('bank_deposit',{p_amt:a},`${fmt(a)}チップを預金に入金しました`);if(!r.ok)setWallet(wallet()+Number(a));updateLive()}
async function doOut(){const a=num('#ma');if(a<1)return toast('金額を入力してください','err');if(a>S.dep)return toast('預金残高が足りません','err');

/* ============ 投資 ============ */
/* ---- 信用取引・空売り ---- */
/* レベル報酬：建玉上限はLv100ごとに+100億（基本100億・最大10兆）／待ち時間はLv500ごとに-10秒（基本30秒・最小10秒）／カジノの通信料はLv1000ごとに-0.1%（基本1%・最小0.1%） */
const lvN=()=>LV&&LV.level!=null?Math.max(0,Math.floor(Number(LV.level))||0):0;
const mgLimitAt=l=>Math.min(1e13,1e10*(1+Math.floor(l/100))),mgWaitAt=l=>Math.max(10,30-10*Math.floor(l/500)),feeAt=l=>Math.max(1,10-Math.floor(l/1000))/10;   // feeAt＝通信料（％）
const MGL=()=>mgLimitAt(lvN()),MGW=()=>mgWaitAt(lvN())*1000;   // 1回の建玉の上限／建ててから決済できるまで・決済後に建てられるまで（ミリ秒）
const LV_TITLES=[[0,'見習い'],[1,'ルーキー'],[10,'常連'],[50,'資産家'],[100,'富豪'],[500,'大富豪'],[1000,'財閥'],[5000,'王'],[10000,'伝説']],
  lvTitle=l=>{let r=LV_TITLES[0][1];for(const [m,n] of LV_TITLES)if(l>=m)r=n;return r};
let mgCd=0;                                     // 次に建てられるようになる時刻（決済後30秒）
function mgCard(){
  if(!S.mgc)return '';
  if(!LV&&!lvBusy)fetchLv();   // サーバー側が未更新のときは出さない
  const c=MGC(),L=S.margin||[],has=L.some(p=>p.sym==ui.sel),d=SYMS.find(x=>x.id==ui.sel);
  const form=has
    ?`<p class="lp">この銘柄にはすでに信用建玉があります。決済すると、新しく建てられます。</p>`
    :`<label class="lab" for="mq">株数</label><input id="mq" type="number" inputmode="numeric" min="1" step="1" value="10" oninput="mgPrev()">
  <div class="qs"><button class="q" onclick="setV('#mq',10);mgPrev()">10</button><button class="q" onclick="setV('#mq',100);mgPrev()">100</button><button class="q" onclick="setV('#mq',1000);mgPrev()">1000</button><button class="q" onclick="mgMax()">買える最大</button></div>
  <label class="lab" for="ml">倍率</label><select id="ml" onchange="mgPrev()">${c.levs.map(l=>`<option value="${l}"${l==3?' selected':''}>${l}倍</option>`).join('')}</select>
  <div id="mp" class="lp"></div>
  <div class="btns"><button class="btn buy" onclick="mgOpen('long')">信用買い</button><button class="btn sell" onclick="mgOpen('short')">空売り</button></div>`;
  const rule=`<p class="mut">預金を<b>保証金</b>にして、その${c.levs.join('・')}倍までの株を取引します。<b>信用買い</b>は値上がりで得、<b>空売り</b>は値下がりで得。損益は倍率ぶん大きくなります。損失が保証金の${Math.round(c.liq*100)}％に達すると自動で<b>ロスカット</b>（強制決済）。損失は保証金までで、借金にはなりません。保有中は建玉の${+(c.rate*100).toFixed(2)}％／時間の金利がかかります。<br><b>1回の建玉は${fmt(MGL())}まで</b>。建ててから<b>${MGW()/1000}秒間は決済できず</b>、決済したあと<b>${MGW()/1000}秒間は新しく建てられません</b>。<span class="mut">（レベルが上がると上限が増え、待ち時間が短くなります）</span></p>`;
  const lst=L.length?`<div class="card"><h2>信用建玉 <small>含み損益はリアルタイム</small></h2>${L.map(mgItem).join('')}</div>`:'';
  return `<div class="card"><h2>信用取引・空売り <small>${esc(d.name)}</small></h2>${rule}${form}</div>${lst}`}
function mgItem(p){
  const dn=SYMS.find(x=>x.id==p.sym)||{name:p.sym},k=x=>`data-mg="${p.sym}:${x}"`;
  return `<div class="item"><div class="top"><b>${esc(dn.name)} <span class="lock">${p.side=='long'?'信用買い':'空売り'} ×${p.lev}</span></b><b class="amt" style="font-size:20px" ${k('pl')}></b></div>
  <div class="mut">${fmt(p.q)}株 ／ 建値 ${(+p.e).toFixed(1)} → 現在値 <b ${k('px')}></b> ／ 保証金 ${fmt(p.m)}</div>
  <div class="mut">評価額 <b ${k('eq')}></b> ／ 金利累計 <b ${k('it')}></b> ／ ロスカット <b ${k('lq')}></b></div>
  <div class="prog"><i ${k('bar')} style="width:0"></i></div><div class="mut">ロスカットまでの余裕（右へ行くほど危険）</div>
  <div class="mut" ${k('hd')}></div>
  <button class="btn s" style="margin-top:8px" ${k('btn')} onclick="mgClose('${p.sym}')">決済する</button></div>`}
function mgLive(){
  if(!S||!S.mgc||!S.margin)return;
  const t=now(),c=MGC();
  S.margin.forEach(p=>{
    const q=k=>document.querySelector(`[data-mg="${p.sym}:${k}"]`);if(!q('pl'))return;
    const eq=mgEq(p,t),pl=eq-p.m,it=mgInt(p,t),dist=(p.m*c.liq-it)/p.q,lq=Math.max(0,p.side=='long'?p.e-dist:p.e+dist),use=clamp((p.m-eq)/(p.m*c.liq),0,1);
    const a=q('pl');a.textContent=(pl>=0?'+':'−')+fmt(Math.abs(pl));a.className='amt '+(pl>=0?'up':'dn');
    q('px').textContent=P(p.sym).toFixed(1);q('eq').textContent=fmt(Math.max(0,eq));q('it').textContent=fmt(it);q('lq').textContent=lq.toFixed(1)+(p.side=='long'?' 以下':' 以上');
    const b=q('bar');b.style.width=(use*100).toFixed(1)+'%';b.style.background=use<.5?'#1b7f4b':use<.8?'#d4af37':'#c8322f';
    const rem=Math.ceil((p.t+MGW()-t)/1000),hd=q('hd'),bt=q('btn');
    if(hd)hd.textContent=rem>0?`⏳ あと${rem}秒で決済できます`:'';if(bt)bt.disabled=rem>0});
  mgPrev()}
function mgPrev(){
  const e=$('#mq'),o=$('#mp');if(!e||!o)return;
  const q=Math.max(0,Math.floor(+e.value)||0),l=+$('#ml').value,p=P(ui.sel),c=MGC();
  if(!q){o.innerHTML='株数を入力してください';return}
  if(p<=0){o.innerHTML='株価がマイナス（0以下）の間は信用買い・空売りができません';return}
  const n=Math.round(p*q),m=Math.max(1,Math.ceil(n/l)),dd=m*c.liq/q,cd=Math.ceil((mgCd-now())/1000);
  const warn=(cd>0?`<span class="dn">⏳ 決済後のため、あと${cd}秒は建てられません</span><br>`:'')+(n>MGL()?`<span class="dn">1回の建玉は${fmt(MGL())}までです（今回 ${fmt(n)}）</span><br>`:'');
  o.innerHTML=warn+`建玉 <b>${fmt(n)}</b> ／ 必要な保証金 <b>${fmt(m)}</b>（預金から引かれます）<br>ロスカット目安：信用買い <b>${Math.max(0,p-dd).toFixed(1)}</b> 以下 ／ 空売り <b>${(p+dd).toFixed(1)}</b> 以上<br>金利：約 <b>${fmt(Math.round(n*c.rate))}</b> ／ 時間`}
function mgMax(){const l=+$('#ml').value,p=P(ui.sel);if(p<=0)return toast('株価がマイナス（0以下）の間は建てられません','err');setV('#mq',Math.max(1,Math.floor(Math.min(Number(S.dep)*l,MGL())/p)));mgPrev()}
function mgOpen(side){
  const q=numN('#mq'),l=+$('#ml').value,d=SYMS.find(x=>x.id==ui.sel);
  if(q<1)return toast('株数を入力してください','err');
  if(P(ui.sel)<=0)return toast('株価がマイナス（0以下）の間は信用買い・空売りができません','err');
  const cd=Math.ceil((mgCd-now())/1000);
  if(cd>0)return toast(`決済したあと${MGW()/1000}秒間は建てられません（あと${cd}秒）`,'err');
  if(Math.round(P(ui.sel)*q)>MGL())return toast(`1回の建玉は${fmt(MGL())}までです`,'err');
  const m=Math.max(1,Math.ceil(Math.round(P(ui.sel)*q)/l));
  if(m>S.dep)return toast(`預金が足りません（必要な保証金 ${fmt(m)}）`,'err');
  act('bank_margin_open',{p_sym:d.id,p_side:side,p_qty:q,p_lev:l},r=>`${d.name}を${side=='long'?'信用買い':'空売り'}しました（${(+r.price).toFixed(1)}・保証金${fmt(r.margin)}）`)}
async function mgClose(sym){
  const d=SYMS.find(x=>x.id==sym)||{name:sym},p=(S.margin||[]).find(x=>x.sym==sym);
  const rem=p?Math.ceil((p.t+MGW()-now())/1000):0;
  if(rem>0)return toast(`建ててから${MGW()/1000}秒間は決済できません（あと${rem}秒）`,'err');
  const r=await act('bank_margin_close',{p_sym:sym},r=>`${d.name}の建玉を決済しました（受取 ${fmt(r.pay)}・損益 ${r.pnl>=0?'+':'−'}${fmt(Math.abs(r.pnl))}）`);
  if(r.ok)mgCd=now()+MGW()}
function selSym(id){ui.sel=id;saveUi();render();pollMk()}
const maxBuy=()=>{const pc=BigInt(Math.round(P(ui.sel)*100));if(pc<=0n)return 0n;const x=S.dep*100n/pc,mx=10n**30n;return x>mx?mx:x};
const NEGMSG='株価がマイナス（0以下）の間は買えません';
function qtyPrev(){const e=$('#qty');if(!e)return;const q=num('#qty'),p=P(ui.sel);$('#qc').textContent=p<=0?NEGMSG:q?`${fmt(q)}株 × ${p.toFixed(1)} ＝ 約${fmt(mulP(q,p))}チップ`:''}
function buy(){const q=num('#qty');if(q<1)return toast('株数を入力してください','err');if(P(ui.sel)<=0)return toast(NEGMSG,'err');const d=SYMS.find(x=>x.id==ui.sel);
  act('bank_buy',{p_sym:d.id,p_qty:q},r=>`${d.name}を${q}株買いました（${(+r.price).toFixed(1)}）`)}
function sell(){const q=num('#qty');const d=SYMS.find(x=>x.id==ui.sel);if(q<1)return toast('株数を入力してください','err');if(q>H(d.id).q)return toast(`保有は${H(d.id).q}株です`,'err');
  act('bank_sell',{p_sym:d.id,p_qty:q},r=>`${d.name}を${q}株売りました（${(+r.price).toFixed(1)}）`)}
function hinfo(){const h=H(ui.sel),p=P(ui.sel),v=mulP(h.q,p),pl=v-h.c;
  return h.q?`保有 <b>${fmt(h.q)}株</b> ／ 評価額 <b>${fmt(v)}</b> ／ 取得平均 ${(Number(h.c*100n/h.q)/100).toFixed(1)} ／ 評価損益 <b class="${pl>=0?'up':'dn'}">${pl>=0?'+':''}${fmt(pl)}</b>`:'この銘柄は持っていません'}
function spark(h){const a=h.length<2?[h[0],h[0]]:h;let mn=Math.min(...a),mx=Math.max(...a);if(mx-mn<1e-9){mx+=1;mn-=1}
  const pts=a.map((v,i)=>`${(i/(a.length-1)*100).toFixed(1)},${(26-(v-mn)/(mx-mn)*24).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 100 28" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${a[a.length-1]>=a[0]?'#c62839':'#1f6fd1'}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`}
function chartSVG(h){const W=600,H=220,a=h.length<2?[h[0],h[0]]:h;let mn=Math.min(...a),mx=Math.max(...a);if(mx-mn<Math.abs(mn)*.002+1e-9){const e=Math.abs(mn)*.001+.01;mx+=e;mn-=e}
  const pad=(mx-mn)*.14;mn-=pad;mx+=pad;const X=i=>i/(a.length-1)*W,Y=v=>H-(v-mn)/(mx-mn)*H;
  const pts=a.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' '),up=a[a.length-1]>=a[0],c=up?'#c62839':'#1f6fd1';
  const grid=[0,1,2,3].map(i=>{const y=(H/3*i).toFixed(1),v=mx-(mx-mn)/3*i;return `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#d6e1ea" stroke-width="1"/><text x="${W-6}" y="${Math.min(H-4,+y+13)}" text-anchor="end" font-size="12" fill="#5a6b85">${v.toFixed(1)}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="株価チャート">${grid}<line x1="0" x2="${W}" y1="${Y(a[0]).toFixed(1)}" y2="${Y(a[0]).toFixed(1)}" stroke="#8d9db8" stroke-dasharray="4 4"/><polygon points="0,${H} ${pts} ${W},${H}" fill="${c}" opacity=".10"/><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"/><circle cx="${W}" cy="${Y(a[a.length-1]).toFixed(1)}" r="4.5" fill="${c}"/></svg>`}

let cnt=0;
function due(){const t=now();return S.fixed.some(f=>t>=f.end)||S.apps.some(a=>t>=a.end)||S.loans.some(l=>!l.od&&t>l.due)}
/* 更新の頻度：通帳など=10秒ごと／投資タブ=株価3秒ごと＋状態9秒ごと（建玉があれば6秒）。
   2分間さわらなかったら止めて、さわったらすぐ再開する。 */
let quietN=0,lastSg='',lastMkT=0;
const IDLE=60000;let lastAct=Date.now(),idleOn=false;
function onAct(){
  const was=Date.now()-lastAct>IDLE;lastAct=Date.now();
  if(was&&S&&!document.hidden){idleOn=false;refresh(ui.tab=='inv')}
}
['pointerdown','pointermove','keydown','touchstart','wheel','scroll'].forEach(ev=>addEventListener(ev,onAct,{passive:true,capture:true}));
setInterval(()=>{
  if(document.hidden||!S)return;
  if(Date.now()-lastAct>IDLE){if(!idleOn){idleOn=true;toast('操作がないため更新を止めました。画面にふれると再開します')}return}
  cnt++;updateLive();
